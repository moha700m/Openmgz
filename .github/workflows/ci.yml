name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install nothing (zero dependencies)
        run: node -v
      - name: Unit tests (archive safety + analyzer + generator)
        run: node tests/run.mjs
